<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KRAY.NETWORK · Mente</title>
<meta name="description" content="Escolha um modelo, baixe, fale com o livro. Ou cole Claude, Grok ou GPT. A chave fica no seu aparelho.">
<link rel="icon" href="/kray-mark.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/kray.css">
<style>
  /* Mind — product wrap. Tokens from /kray.css. Easy shop + Grok-class chat. */
  html,body{height:100%;}
  body[data-page="mind"]{overflow:hidden;background-image:none;background:var(--void);}
  body[data-page="mind"] header.nav{border-bottom-color:transparent;background:rgba(0,0,0,.55);}

  .mind{height:calc(100dvh - var(--nav-h));display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .mind::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(247,147,26,.08),transparent 55%),
               radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,255,255,.04),transparent 50%);}

  .mind-bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
    gap:var(--s3);padding:var(--s3) max(var(--page-gutter),env(safe-area-inset-left));
    padding-right:max(var(--page-gutter),env(safe-area-inset-right));}
  .mind-bar__who{min-width:0;font:12px/1.4 var(--mono);color:var(--ink-3);letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mind-bar__who b{color:var(--ink);font-weight:600;}
  .mind-bar__acts{display:flex;gap:var(--s2);flex:none;}
  .mind-btn{min-height:44px;padding:0 var(--s4);border:1px solid var(--line-2);border-radius:var(--r-pill);
    background:transparent;color:var(--ink);font:13px/1 var(--sans);font-weight:600;cursor:pointer;}
  .mind-btn:hover{border-color:var(--ink-3);}
  .mind-btn--on{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);}
  .mind-btn--ghost{color:var(--ink-3);}

  .mind-stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;
    width:min(760px,100%);margin:0 auto;}
  .mind-log{flex:1;min-height:0;overflow-y:auto;padding:var(--s4) max(var(--s4),env(safe-area-inset-left)) var(--s3);
    padding-right:max(var(--s4),env(safe-area-inset-right));display:flex;flex-direction:column;gap:var(--s5);}

  .mind-empty{margin:auto;text-align:center;padding:var(--s8) var(--s4);max-width:28rem;}
  .mind-empty img{width:56px;height:56px;border-radius:50%;display:block;margin:0 auto var(--s5);
    box-shadow:0 0 80px rgba(247,147,26,.18);}
  .mind-empty h1{font-size:clamp(40px,8vw,64px);font-weight:500;letter-spacing:-.04em;line-height:1;margin:0 0 var(--s4);}
  .mind-empty p{margin:0;font-size:17px;line-height:1.55;color:var(--ink-2);}

  .mind-m{max-width:min(100%,42rem);font-size:16.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .mind-m--me{align-self:flex-end;padding:12px 16px;border-radius:20px 20px 6px 20px;background:var(--surface-2);color:var(--ink);}
  .mind-m--ai{align-self:stretch;color:var(--ink);}
  .mind-m--wait{display:flex;gap:6px;align-items:center;min-height:28px;}
  .mind-m--wait i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.35;
    animation:mind-dot 1.2s infinite ease-in-out;}
  .mind-m--wait i:nth-child(2){animation-delay:.15s;}
  .mind-m--wait i:nth-child(3){animation-delay:.3s;}
  @keyframes mind-dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  .mind-dock{flex:none;padding:0 max(var(--s4),env(safe-area-inset-left))
    calc(var(--s4) + env(safe-area-inset-bottom));padding-right:max(var(--s4),env(safe-area-inset-right));}
  .mind-ask{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin:0 0 var(--s3);}
  .mind-chip{min-height:40px;padding:8px 14px;border:1px solid var(--line-2);border-radius:var(--r-pill);
    background:rgba(20,21,24,.7);color:var(--ink-2);font:13px/1.3 var(--sans);cursor:pointer;}
  .mind-chip:hover{border-color:var(--ink-3);color:var(--ink);}
  .mind-chip.on{border-color:var(--signal);color:var(--ink);background:rgba(255,255,255,.06);}

  .mind-form{display:flex;align-items:flex-end;gap:var(--s2);padding:8px 8px 8px 16px;
    border:1px solid var(--line-2);border-radius:28px;background:var(--surface);box-shadow:var(--shadow);}
  .mind-form:focus-within{border-color:var(--ink-3);}
  .mind-in{flex:1;min-height:40px;max-height:160px;border:0;background:transparent;resize:none;
    font:16px/1.45 var(--sans);padding:8px 0;outline:none;}
  .mind-in:disabled{opacity:.45;}
  .mind-send{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--signal);
    color:var(--signal-ink);cursor:pointer;display:grid;place-items:center;}
  .mind-send:disabled{opacity:.28;cursor:default;}
  .mind-send svg{display:block;}
  .mind-fine{margin:var(--s2) 0 0;text-align:center;font:12px/1.45 var(--sans);color:var(--ink-4);}
  .mind-err{margin:var(--s2) 0 0;text-align:center;font:13px/1.45 var(--sans);color:var(--crit);}

  .mind-veil{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transition:opacity .2s var(--ease);}
  .mind-veil.on{opacity:1;pointer-events:auto;}
  .mind-sheet{position:fixed;z-index:90;top:0;right:0;height:100dvh;width:min(440px,100%);
    background:var(--panel);border-left:1px solid var(--line);transform:translateX(104%);
    transition:transform .28s var(--ease);display:flex;flex-direction:column;
    padding:calc(var(--s4) + env(safe-area-inset-top)) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));}
  .mind-sheet.on{transform:none;}
  .mind-sheet h2{font-size:28px;letter-spacing:-.03em;font-weight:500;margin:var(--s3) 0 var(--s2);}
  .mind-sheet .lede{font-size:15px;margin:0 0 var(--s5);}
  .mind-x{position:absolute;top:calc(var(--s3) + env(safe-area-inset-top));right:var(--s4);
    width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);cursor:pointer;font-size:22px;}
  .mind-tabs{display:flex;gap:var(--s2);margin:0 0 var(--s5);}
  .mind-tab{flex:1;min-height:48px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);
    color:var(--ink-2);font:12px/1.2 var(--sans);font-weight:600;cursor:pointer;}
  .mind-tab.on{border-color:var(--signal);color:var(--ink);background:rgba(255,255,255,.06);}
  .mind-fields{flex:1;min-height:0;overflow-y:auto;}
  .mind-hint{font:13px/1.5 var(--sans);color:var(--ink-3);margin:0 0 var(--s4);}
  .mind-field{display:block;margin:0 0 var(--s4);}
  .mind-field span{display:block;font:11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-4);margin:0 0 var(--s2);}
  .mind-field input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line-2);
    border-radius:var(--r2);background:var(--surface);font:15px/1 var(--sans);}
  .mind-go{width:100%;min-height:48px;border:0;border-radius:var(--r-pill);background:var(--signal);
    color:var(--signal-ink);font:15px/1 var(--sans);font-weight:700;cursor:pointer;display:grid;place-items:center;
    text-decoration:none;}
  .mind-go:disabled{opacity:.35;cursor:default;}
  .mind-unplug{width:100%;min-height:44px;margin-top:var(--s3);border:1px solid var(--line);
    border-radius:var(--r-pill);background:transparent;color:var(--ink-3);font:13px/1 var(--sans);cursor:pointer;}
  .mind-book{margin-top:var(--s5);font:12px/1.5 var(--mono);color:var(--ink-4);}
  .mind-book b{color:var(--ink-3);}

  .mind-hero{padding:var(--s4);border:1px solid var(--line);border-radius:var(--r3);background:var(--surface);margin:0 0 var(--s5);}
  .mind-hero h3{font-size:17px;font-weight:600;margin:0 0 var(--s2);}
  .mind-hero p{margin:0 0 var(--s4);font-size:14px;line-height:1.5;color:var(--ink-2);}
  .mind-copy{width:100%;min-height:44px;margin-top:var(--s3);border:1px dashed var(--line-2);
    border-radius:var(--r2);background:transparent;color:var(--ink-3);font:12px/1.4 var(--mono);cursor:pointer;}

  .mind-mod{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
    text-align:left;margin:0 0 var(--s2);padding:14px 16px;min-height:64px;border:1px solid var(--line);
    border-radius:var(--r3);background:var(--surface);color:inherit;cursor:pointer;}
  .mind-mod:hover{border-color:var(--ink-3);}
  .mind-mod.on{border-color:var(--signal);}
  .mind-mod .t{font-size:15px;font-weight:600;}
  .mind-mod .s{grid-column:1;font-size:12px;color:var(--ink-3);}
  .mind-mod .a{grid-row:1 / span 2;grid-column:2;font:12px/1 var(--mono);color:var(--ink-2);white-space:nowrap;}
  .mind-mod .bar{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;}
  .mind-mod .bar i{display:block;height:100%;width:0;background:var(--signal);transition:width .2s;}

  .mind-vend{display:flex;gap:var(--s2);margin:0 0 var(--s4);}
  .mind-vend button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:var(--r2);
    background:var(--surface);color:var(--ink-2);font:13px/1 var(--sans);font-weight:600;cursor:pointer;}
  .mind-vend button.on{border-color:var(--signal);color:var(--ink);}

  @media(max-width:639px){
    .mind-empty h1{font-size:40px;}
    .mind-m{font-size:16px;}
    .mind-sheet{width:100%;}
  }
</style>
</head>
<body data-page="mind">
<script>window.KRAY_FOOTER = false;</script>
<script src="/kray.js"></script>

<div class="mind" id="mind">
  <div class="mind-bar">
    <div class="mind-bar__who" id="who">Mente · sem IA</div>
    <div class="mind-bar__acts">
      <button type="button" class="mind-btn mind-btn--ghost" id="fresh" hidden>Nova conversa</button>
      <button type="button" class="mind-btn mind-btn--on" id="open-sheet">Conectar IA</button>
    </div>
  </div>
  <div class="mind-stage">
    <div class="mind-log" id="log"></div>
    <div class="mind-dock">
      <div class="mind-ask" id="ask"></div>
      <form class="mind-form" id="form" autocomplete="off">
        <textarea class="mind-in" id="q" rows="1" placeholder="Pergunte qualquer coisa" disabled></textarea>
        <button type="submit" class="mind-send" id="send" disabled aria-label="Enviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </form>
      <p class="mind-fine">A chave e o modelo ficam neste aparelho. O nó nunca vê.</p>
      <p class="mind-err" id="err"></p>
    </div>
  </div>
</div>

<div class="mind-veil" id="veil" hidden></div>
<aside class="mind-sheet" id="sheet" hidden aria-label="Conectar sua IA">
  <button type="button" class="mind-x" id="close-sheet" aria-label="Fechar">×</button>
  <h2>Sua IA</h2>
  <p class="lede">Baixe um cérebro neste computador — ou cole uma chave. Depois é só falar.</p>
  <div class="mind-tabs" role="tablist">
    <button type="button" class="mind-tab on" data-kind="facil">Fácil</button>
    <button type="button" class="mind-tab" data-kind="chave">Chave</button>
    <button type="button" class="mind-tab" data-kind="avancado">Avançado</button>
  </div>
  <div class="mind-fields" id="fields"></div>
  <div class="mind-book" id="book-line">Lendo o livro deste nó…</div>
</aside>

<script>
(function () {
  'use strict';
  var LS = 'kray.mind.v1';
  var OLLAMA = 'http://127.0.0.1:11434';
  var TWELVE = ['indole', 'canon', 'foundation', 'divine', 'algorithm', 'kray', 'bitcoin', 'fenyx', 'consensus', 'diretriz', 'consciousness', 'lightdoor'];
  var ASK = ['O que é KRAY?', 'O que é uma estrela?', 'A mente escreve o livro?'];
  var SHOP = [
    { id: 'llama3.2', title: 'Llama 3.2', sub: 'O mais fácil · ~2 GB' },
    { id: 'llama3.2:1b', title: 'Llama leve', sub: 'Cabe em qualquer PC · ~1 GB' },
    { id: 'qwen2.5:1.5b', title: 'Qwen rápido', sub: 'Responde na hora · ~1 GB' },
    { id: 'gemma2:2b', title: 'Gemma 2', sub: 'Google · ~1.6 GB' },
    { id: 'qwen2.5:7b', title: 'Qwen 7B', sub: 'Mais caprichado · ~4.7 GB' }
  ];
  var WRAP = 'Form only. Answer first. Direct. No helpdesk closer. Reply in the user language. No code. If a number is not in the book below, say you do not have it. You never write, mint, or change the book.';
  var LINK = 'The text below is the public KRAY.NETWORK book. That book is your memory. The user did not upload it. Who you are lives in that book. Speak from it. If asked whether you have memory: yes — the book. Chat is not stored. Do not call yourself a virtual assistant. Do not say a file was provided. Do not offer more help. Stop when the answer is done.';
  var DOCS_CORE = ['indole', 'canon', 'kray', 'consciousness', 'foundation', 'axioms', 'book-and-apps', 'krayos-mind'];
  function originsAllow() {
    return 'OLLAMA_ORIGINS=' + location.origin + ' ollama serve';
  }

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  };
  function loopback(u) {
    try {
      var x = new URL(String(u || '').trim());
      var h = String(x.hostname || '').toLowerCase();
      if ((x.protocol !== 'http:' && x.protocol !== 'https:') || (h !== '127.0.0.1' && h !== 'localhost' && h !== '[::1]')) return null;
      return x.origin;
    } catch (_) { return null; }
  }
  function isChatModel(n) {
    n = String(n || '').toLowerCase();
    return n && !/embed|whisper|tts/.test(n);
  }
  function loadPlug() {
    try { return JSON.parse(localStorage.getItem(LS) || 'null') || { kind: 'none' }; }
    catch (_) { return { kind: 'none' }; }
  }
  function savePlug(p) {
    localStorage.setItem(LS, JSON.stringify(p));
    plug = p;
  }
  function vendorName(k) {
    if (k === 'claude') return 'Claude';
    if (k === 'grok') return 'Grok';
    if (k === 'gpt') return 'GPT';
    return k;
  }

  var plug = loadPlug();
  var chat = [];
  var thinking = false;
  var tab = 'facil';
  var vendor = (plug.kind === 'claude' || plug.kind === 'grok' || plug.kind === 'gpt') ? plug.kind : 'claude';
  var models = [];
  var ollamaUp = false;
  var book = { ok: 0, text: '' };
  var docsFiles = [];
  var sheetOpen = false;
  var pulling = null;
  var pollTimer = null;

  function plugged() {
    if (plug.kind === 'local') return !!(plug.model);
    if (plug.kind === 'claude' || plug.kind === 'grok' || plug.kind === 'gpt') return !!(plug.key && String(plug.key).length > 8);
    return false;
  }
  function whoLabel() {
    if (!plugged()) return 'Mente · sem IA';
    if (plug.kind === 'local') return 'Mente · <b>' + esc(plug.model) + '</b>';
    return 'Mente · <b>' + vendorName(plug.kind) + '</b>';
  }
  function installedAs(id) {
    var i, m;
    for (i = 0; i < models.length; i++) {
      m = models[i];
      if (m === id || m === id + ':latest') return m;
    }
    return '';
  }
  function extraInstalled() {
    var known = {};
    SHOP.forEach(function (s) { known[s.id] = true; known[s.id + ':latest'] = true; });
    return models.filter(function (m) {
      return isChatModel(m) && !known[m] && m !== installedAs(m.split(':')[0]);
    });
  }

  function paintLog() {
    var log = $('log');
    if (!chat.length && !thinking) {
      log.innerHTML = '<div class="mind-empty">' +
        '<img src="/kray-mark.svg" width="56" height="56" alt="">' +
        '<h1>Mente</h1>' +
        '<p>Escolha um modelo, baixe, fale. Ou cole Claude, Grok ou GPT. Um toque.</p>' +
      '</div>';
      return;
    }
    var h = chat.map(function (m) {
      return '<div class="mind-m mind-m--' + (m.role === 'user' ? 'me' : 'ai') + '">' + esc(m.content) + '</div>';
    }).join('');
    if (thinking) h += '<div class="mind-m mind-m--ai mind-m--wait" aria-label="pensando"><i></i><i></i><i></i></div>';
    log.innerHTML = h;
    log.scrollTop = log.scrollHeight;
  }
  function paintAsk() {
    var box = $('ask');
    if (chat.length || !plugged()) { box.innerHTML = ''; return; }
    box.innerHTML = ASK.map(function (t) {
      return '<button type="button" class="mind-chip" data-ask="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
    box.querySelectorAll('[data-ask]').forEach(function (b) {
      b.addEventListener('click', function () { sendText(b.getAttribute('data-ask')); });
    });
  }
  function paintBar() {
    $('who').innerHTML = whoLabel();
    $('fresh').hidden = !chat.length;
    var on = plugged();
    $('q').disabled = !on || thinking;
    $('send').disabled = !on || thinking;
    $('q').placeholder = on ? 'Pergunte qualquer coisa' : 'Conecte sua IA para conversar';
    $('open-sheet').className = 'mind-btn' + (on ? '' : ' mind-btn--on');
    $('open-sheet').textContent = on ? 'Trocar IA' : 'Conectar IA';
  }
  function grow() {
    var ta = $('q');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  }
  function showErr(t) { $('err').textContent = t || ''; }
  function paint() {
    paintBar();
    paintLog();
    paintAsk();
    grow();
  }

  function cardHtml(id, title, sub) {
    var have = installedAs(id);
    var on = plug.kind === 'local' && (plug.model === have || plug.model === id);
    var pull = pulling && pulling.id === id;
    var action = have ? 'Falar agora' : 'Baixar e falar';
    if (pull) action = pulling.pct >= 0 ? ('Baixando ' + pulling.pct + '%') : 'Baixando…';
    return '<button type="button" class="mind-mod' + (on ? ' on' : '') + '" data-shop="' + esc(id) + '"' + (pull ? ' disabled' : '') + '>' +
      '<span class="t">' + esc(title) + '</span>' +
      '<span class="a">' + esc(action) + '</span>' +
      '<span class="s">' + esc(sub) + (have ? ' · pronto neste PC' : '') + '</span>' +
      (pull ? '<span class="bar"><i style="width:' + Math.max(4, pulling.pct) + '%"></i></span>' : '') +
    '</button>';
  }
  function facilHtml() {
    if (!ollamaUp) {
      return '<div class="mind-hero">' +
        '<h3>1. Instale o Ollama</h3>' +
        '<p>É um app grátis. Depois esta página baixa o modelo e já liga na Mente.</p>' +
        '<a class="mind-go" href="https://ollama.com/download" target="_blank" rel="noopener">Baixar Ollama</a>' +
        '<button type="button" class="mind-copy" id="mind-origins">Já instalou e deu 403? Toque para copiar só esta origem (nunca *)</button>' +
        '<p class="mind-hint" style="margin:12px 0 0">Ou cole uma chave em <b>Chave</b> — Claude, Grok ou GPT.</p>' +
      '</div>';
    }
    var krayos = models.filter(function (m) { return /^krayos/i.test(m); });
    var html = '<p class="mind-hint">Toque. Se faltar, a gente baixa e já deixa falando.</p>';
    if (krayos.length) {
      html += cardHtml(krayos[0], 'KRAYOS', 'O módulo deste computador');
    }
    SHOP.forEach(function (s) { html += cardHtml(s.id, s.title, s.sub); });
    extraInstalled().forEach(function (m) {
      html += cardHtml(m, m, 'Já neste computador');
    });
    return html + (plugged() ? '<button type="button" class="mind-unplug" id="mind-wipe">Desconectar</button>' : '');
  }
  function chaveHtml() {
    var ph = vendor === 'claude' ? 'sk-ant-…' : (vendor === 'grok' ? 'xai-…' : 'sk-…');
    return '<p class="mind-hint">Cola a chave. Fica só neste navegador. O livro nunca a vê.</p>' +
      '<div class="mind-vend">' +
        '<button type="button" data-vendor="claude"' + (vendor === 'claude' ? ' class="on"' : '') + '>Claude</button>' +
        '<button type="button" data-vendor="grok"' + (vendor === 'grok' ? ' class="on"' : '') + '>Grok</button>' +
        '<button type="button" data-vendor="gpt"' + (vendor === 'gpt' ? ' class="on"' : '') + '>GPT</button>' +
      '</div>' +
      '<label class="mind-field"><span>Chave ' + vendorName(vendor) + '</span>' +
      '<input id="mind-key" type="password" autocomplete="off" spellcheck="false" placeholder="' + ph + '"></label>' +
      '<button type="button" class="mind-go" id="mind-save">Guardar e conversar</button>' +
      (plugged() ? '<button type="button" class="mind-unplug" id="mind-wipe">Desconectar</button>' : '');
  }
  function avancadoHtml() {
    return '<p class="mind-hint">Ollama, LM Studio ou qualquer chat local neste computador.</p>' +
      '<label class="mind-field"><span>Endereço local</span>' +
      '<input id="mind-url" autocomplete="off" spellcheck="false" value="' + esc(plug.url || OLLAMA) + '"></label>' +
      '<label class="mind-field"><span>Nome do modelo</span>' +
      '<input id="mind-model" autocomplete="off" spellcheck="false" placeholder="llama3.2" value="' + esc(plug.kind === 'local' ? (plug.model || '') : '') + '"></label>' +
      '<button type="button" class="mind-go" id="mind-adv">Ligar e conversar</button>' +
      (plugged() ? '<button type="button" class="mind-unplug" id="mind-wipe">Desconectar</button>' : '');
  }
  function fieldsHtml() {
    if (tab === 'chave') return chaveHtml();
    if (tab === 'avancado') return avancadoHtml();
    return facilHtml();
  }
  function bindSheet() {
    document.querySelectorAll('.mind-tab').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-kind') === tab);
    });
    $('book-line').innerHTML = (docsFiles.length
      ? 'Docs · <b>' + docsFiles.length + '</b> arquivos'
      : 'Docs ainda não lidos') +
      (book.ok ? ' · estrelas <b>' + book.ok + '/' + TWELVE.length + '</b>' : '');
    $('fields').querySelectorAll('[data-shop]').forEach(function (b) {
      b.addEventListener('click', function () { useShop(b.getAttribute('data-shop')); });
    });
    $('fields').querySelectorAll('[data-vendor]').forEach(function (b) {
      b.addEventListener('click', function () { vendor = b.getAttribute('data-vendor'); paintSheet(); });
    });
    var save = $('mind-save');
    if (save) save.addEventListener('click', saveKey);
    var adv = $('mind-adv');
    if (adv) adv.addEventListener('click', saveAdv);
    var wipe = $('mind-wipe');
    if (wipe) wipe.addEventListener('click', function () {
      savePlug({ kind: 'none' });
      closeSheet();
      paint();
    });
    var origins = $('mind-origins');
    if (origins) origins.addEventListener('click', function () {
      var cmd = originsAllow();
      try { navigator.clipboard.writeText(cmd); origins.textContent = 'Copiado. Só esta página. Nunca OLLAMA_ORIGINS=*.'; }
      catch (_) { origins.textContent = cmd; }
    });
  }
  function paintSheet() {
    $('fields').innerHTML = fieldsHtml();
    bindSheet();
  }
  function openSheet() {
    sheetOpen = true;
    $('veil').hidden = false;
    $('sheet').hidden = false;
    requestAnimationFrame(function () {
      $('veil').classList.add('on');
      $('sheet').classList.add('on');
    });
    paintSheet();
    probeLocal().then(paintSheet);
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (!sheetOpen) return;
      probeLocal().then(function () { if (sheetOpen && tab === 'facil') paintSheet(); });
    }, 2500);
  }
  function closeSheet() {
    sheetOpen = false;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    $('veil').classList.remove('on');
    $('sheet').classList.remove('on');
    setTimeout(function () {
      if (!sheetOpen) { $('veil').hidden = true; $('sheet').hidden = true; }
    }, 280);
  }

  function linkLocal(name, url) {
    savePlug({ kind: 'local', url: url || OLLAMA, model: name, key: '' });
    closeSheet();
    showErr('');
    paint();
    $('q').focus();
  }
  async function useShop(id) {
    var have = installedAs(id);
    if (have) { linkLocal(have, OLLAMA); return; }
    if (pulling) return;
    pulling = { id: id, pct: 0 };
    paintSheet();
    try {
      await pullModel(id);
      await probeLocal();
      var ready = installedAs(id) || id;
      pulling = null;
      linkLocal(ready, OLLAMA);
    } catch (e) {
      pulling = null;
      paintSheet();
      var msg = String(e && e.message || e);
      if (/Failed to fetch|NetworkError|CORS/i.test(msg)) msg = corsHint('local');
      showErr(msg);
    }
  }
  async function pullModel(id) {
    var r = await fetch(OLLAMA + '/api/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: id, name: id, stream: true }),
    });
    if (!r.ok || !r.body) {
      var err = await r.json().catch(function () { return null; });
      throw new Error((err && err.error) || 'Não deu para baixar este modelo.');
    }
    var reader = r.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      var lines = buf.split('\n');
      buf = lines.pop() || '';
      lines.forEach(function (line) {
        line = line.trim();
        if (!line) return;
        try {
          var j = JSON.parse(line);
          if (j.total && j.completed != null && pulling && pulling.id === id) {
            pulling.pct = Math.min(99, Math.round((j.completed / j.total) * 100));
            if (sheetOpen) paintSheet();
          }
          if (j.error) throw new Error(j.error);
        } catch (e) {
          if (e && e.message && !/JSON/.test(e.message)) throw e;
        }
      });
    }
  }
  function saveKey() {
    var key = String(($('mind-key') && $('mind-key').value) || '').trim();
    if (key.length < 12 || /\s/.test(key)) { showErr('Essa chave não parece válida.'); return; }
    var model = vendor === 'claude' ? 'claude-sonnet-4-5' : (vendor === 'grok' ? 'grok-3-mini' : 'gpt-4o-mini');
    savePlug({ kind: vendor, key: key, model: model });
    if ($('mind-key')) $('mind-key').value = '';
    closeSheet();
    showErr('');
    paint();
    $('q').focus();
  }
  function saveAdv() {
    var url = loopback(($('mind-url') && $('mind-url').value) || OLLAMA);
    var model = String(($('mind-model') && $('mind-model').value) || '').trim();
    if (!url) { showErr('Só endereço deste computador — 127.0.0.1.'); return; }
    if (!model) { showErr('Escreva o nome do modelo.'); return; }
    linkLocal(model, url);
  }

  async function probeLocal() {
    try {
      var r = await fetch(OLLAMA + '/api/tags', { method: 'GET' });
      var j = await r.json();
      var raw = (j && j.models) || [];
      models = raw.map(function (m) { return String(m && m.name || '').trim(); }).filter(Boolean);
      ollamaUp = true;
    } catch (_) {
      models = [];
      ollamaUp = false;
    }
  }

  function pickDocs(query, budget) {
    var cap = budget || 28000;
    var q = String(query || '').toLowerCase().split(/[^a-z0-9]+/).filter(function (w) { return w.length > 2; });
    var scored = docsFiles.map(function (f) {
      var id = String(f && f.id || '');
      var body = String(f && f.text || '');
      var score = DOCS_CORE.indexOf(id) >= 0 ? 1000 : 0;
      var hay = (id + ' ' + body.slice(0, 2000)).toLowerCase();
      q.forEach(function (w) { if (hay.indexOf(w) >= 0) score += 8; });
      return { f: f, score: score };
    }).sort(function (a, b) { return b.score - a.score; });
    var out = [];
    var used = 0;
    scored.forEach(function (row) {
      var chunk = '## ' + row.f.id + '\n' + String(row.f.text || '').trim();
      if (used && used + chunk.length > cap) return;
      if (!used && chunk.length > cap) { out.push(chunk.slice(0, cap)); used = cap; return; }
      out.push(chunk);
      used += chunk.length + 2;
    });
    return { text: out.join('\n\n'), n: out.length };
  }
  async function loadDocs() {
    try {
      var pack = await fetch('/docs/pack.json').then(function (r) { return r.ok ? r.json() : null; });
      docsFiles = pack && Array.isArray(pack.files) ? pack.files : [];
    } catch (_) { docsFiles = []; }
    if (sheetOpen) paintSheet();
  }
  async function loadBook() {
    var parts = [];
    var ok = 0;
    for (var i = 0; i < TWELVE.length; i++) {
      var name = TWELVE[i];
      try {
        var s = await fetch('/api/kraynet/name/' + encodeURIComponent(name)).then(function (r) { return r.ok ? r.json() : null; });
        var hash = s && s.contentHash;
        if (!hash) continue;
        var body = await fetch('/content/' + hash).then(function (r) { return r.ok ? r.text() : ''; });
        if (!body) continue;
        ok += 1;
        parts.push('#' + (s.no || '?') + ' ' + name + '\n' + String(body).slice(0, 8000));
      } catch (_) { /* missing star on this node */ }
    }
    book = { ok: ok, text: parts.join('\n\n').slice(0, 36000) };
    if (sheetOpen) paintSheet();
  }

  function corsHint(kindNow) {
    if (kindNow === 'local') {
      return 'Abra o Ollama neste computador. Se der 403: permita só esta origem (nunca *).';
    }
    return 'O site não fala direto com essa API. Use a extensão KrayWallet, ou um modelo fácil neste PC.';
  }

  async function openaiTalk(url, key, model, messages, system) {
    var r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({
        model: model,
        max_tokens: 512,
        messages: [{ role: 'system', content: system }].concat(messages),
      }),
    });
    var j = await r.json().catch(function () { return null; });
    var text = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!r.ok || !text) throw new Error((j && j.error && j.error.message) || 'A IA não respondeu.');
    return String(text).trim();
  }

  async function talk(messages) {
    var q = messages.length ? messages[messages.length - 1].content : '';
    var docs = pickDocs(q, 28000);
    var system = WRAP
      + (docs.text ? '\n\n' + LINK + '\n\n' + docs.text : '')
      + (book.text ? '\n\nSealed stars from this node:\n' + book.text : '');
    if (plug.kind === 'local') {
      var origin = loopback(plug.url || OLLAMA);
      if (!origin) throw new Error('Modelo local só neste computador (127.0.0.1).');
      var r = await fetch(origin + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: plug.model,
          stream: false,
          messages: [{ role: 'system', content: system }].concat(messages),
          options: { temperature: 0.3, num_predict: 512 },
        }),
      });
      var j = await r.json().catch(function () { return null; });
      var text = j && j.message && j.message.content;
      if (!r.ok || !text) throw new Error((j && j.error) || 'O modelo local não respondeu.');
      return String(text).trim();
    }
    if (plug.kind === 'claude') {
      var rc = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': plug.key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: plug.model || 'claude-sonnet-4-5',
          max_tokens: 512,
          system: system,
          messages: messages,
        }),
      });
      var jc = await rc.json().catch(function () { return null; });
      var tc = jc && jc.content && jc.content[0] && jc.content[0].text;
      if (!rc.ok || !tc) throw new Error((jc && jc.error && jc.error.message) || 'Claude não respondeu.');
      return String(tc).trim();
    }
    if (plug.kind === 'grok') {
      return openaiTalk('https://api.x.ai/v1/chat/completions', plug.key, plug.model || 'grok-3-mini', messages, system);
    }
    return openaiTalk('https://api.openai.com/v1/chat/completions', plug.key, plug.model || 'gpt-4o-mini', messages, system);
  }

  async function sendText(raw) {
    var q = String(raw || '').trim();
    if (!q || thinking) return;
    if (!plugged()) { openSheet(); return; }
    showErr('');
    chat.push({ role: 'user', content: q });
    if (chat.length > 24) chat = chat.slice(-24);
    $('q').value = '';
    thinking = true;
    paint();
    try {
      var text = await talk(chat.map(function (m) { return { role: m.role, content: m.content }; }));
      text = String(text || '').replace(/```[\s\S]*?```/g, '').trim() || 'Posso dizer isso em palavras, não em código.';
      chat.push({ role: 'assistant', content: text });
    } catch (e) {
      var msg = String(e && e.message || e);
      if (/Failed to fetch|NetworkError|CORS/i.test(msg)) msg = corsHint(plug.kind);
      showErr(msg);
    }
    thinking = false;
    paint();
    $('q').focus();
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    sendText($('q').value);
  });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText($('q').value); }
  });
  $('q').addEventListener('input', grow);
  $('open-sheet').addEventListener('click', openSheet);
  $('close-sheet').addEventListener('click', closeSheet);
  $('veil').addEventListener('click', closeSheet);
  $('fresh').addEventListener('click', function () { chat = []; showErr(''); paint(); });
  document.querySelectorAll('.mind-tab').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-kind');
      paintSheet();
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheetOpen) closeSheet();
  });

  paint();
  probeLocal();
  loadDocs();
  loadBook();
  if (!plugged()) openSheet();
})();
</script>
</body>
</html>
