<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAY.NETWORK · Marketplace</title>
<link rel="icon" href="/kray-mark.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="/kray.css?v=txt5">
<style>
  /* Marketplace — page-local only. Cards + tape live in /kray.css. */
  .proofbar{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
  .mk-tabs{display:flex;gap:var(--s2);margin:var(--s5) 0 var(--s5)}
  .empty{color:var(--ink-4);font-family:var(--mono);font-size:13px;padding:var(--s6) 0;text-align:center}
  .toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r2);font-size:13px;max-width:90vw;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .mkstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-top:var(--s5)}
  .mkstat{padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);min-width:0}
  .mkstat .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}
  .mkstat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:768px){.mkstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* Featured — 128px square slides, snap-scroll */
  .slide{margin:0 0 var(--s7)}
  .slide h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 var(--s3)}
  .slide-rail{display:grid;grid-auto-flow:column;grid-auto-columns:var(--s10);gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;
    padding-bottom:var(--s2);-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .sq{display:flex;flex-direction:column;gap:var(--s2);color:inherit;text-decoration:none;scroll-snap-align:start;min-width:0}
  .sq .art{border-radius:var(--r2);border:1px solid var(--line)}
  .sq .art .tg{position:absolute;left:var(--s2);top:var(--s2);z-index:2;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:var(--r1);color:#0a0b0e}
  .sq .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
  .sq .px{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-3)}
  .sq:hover .art{border-color:var(--line-2)}
  /* Collection rank — one board */
  .rkboard{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
  .rkhead,.rkrow{display:grid;grid-template-columns:36px 48px minmax(0,1.8fr) repeat(4,minmax(72px,.7fr));gap:var(--s3);align-items:center;padding:var(--s3) var(--s4)}
  .rkhead{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);border-bottom:1px solid var(--line)}
  .rkrow{border-bottom:1px solid var(--line);color:inherit;text-decoration:none;min-height:64px}
  .rkrow:last-child{border-bottom:0}
  .rkrow:hover{background:var(--surface-2)}
  .rkrow .n,.rkhead .n{font-family:var(--mono);color:var(--ink-4);font-size:12px}
  .rkrow .face.facefill{width:48px;height:48px;border-radius:var(--r1);border:1px solid var(--line)}
  .rkrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rkrow .nm small{display:none;font-family:var(--mono);font-weight:400;color:var(--ink-4);font-size:11px}
  .rkrow .px,.rkrow .cell{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}
  .rkhead span:nth-child(n+4){text-align:right}
  @media(max-width:768px){
    .rkhead span.hide-sm,.rkrow .hide-sm{display:none}
    .rkhead,.rkrow{grid-template-columns:28px 40px minmax(0,1fr) auto;padding:var(--s3)}
    .rkrow .nm small{display:block}
  }
</style>
</head>
<body data-page="market">
<div class="wrap">
  <section class="hero" style="border-top:0">
    <div class="eyebrow"><a href="/" style="color:var(--ink-3)">← explorer</a> &nbsp;·&nbsp; SIGNED · ATOMIC · REPLAYABLE</div>
    <h1>Marketplace</h1>
    <div class="proofbar">
      <span class="chip btc">signed</span>
      <span class="chip">atomic swap</span>
      <span class="chip">fee 1 ₭</span>
      <span class="chip">no custodian</span>
      <span class="chip live" id="live"><i></i>book</span>
      <span class="chip" id="acct">connect KrayWallet</span>
    </div>
    <div class="mkstats" id="mkstats"></div>
  </section>

  <section style="border-top:0;padding-top:0">
    <div class="tabs mk-tabs" id="tabs" role="tablist" aria-label="View">
      <button type="button" class="tab on" data-tab="listed">Listed</button>
      <button type="button" class="tab" data-tab="yours">Yours</button>
      <button type="button" class="tab" data-tab="activity">Activity</button>
      <button type="button" class="tab" data-tab="collections">Collection</button>
    </div>
    <div id="pulse"></div>
    <div id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="/kray.js?v=txt5" defer></script>
<script defer>
(function () {
  'use strict';
  var listings = [], collections = [], pulse = {}, tab = 'listed', me = window.__krayAddr || null;
  var path = (location.pathname || '').replace(/\/$/, '');
  if (path === '/collections' || location.hash === '#collections') tab = 'collections';
  if (location.hash === '#activity') tab = 'activity';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var num = function (v) { try { return BigInt(String(v).replace(/[^0-9]/g, '') || '0').toLocaleString(); } catch (_) { return String(v); } };
  var short = function (a) { return a ? a.slice(0, 8) + '…' + a.slice(-4) : ''; };
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('on'); }, 3200); }

  function paintAcct() { var e = $('acct'); if (e) e.textContent = me ? ('signed as ' + short(me)) : 'connect KrayWallet'; }

  function hue(kind, opts) { return (window.KRAY && KRAY.actCss) ? KRAY.actCss(kind, opts || {}) : '#ff6ea8'; }
  function face(t) { return (window.KRAY && KRAY.faceHtml) ? KRAY.faceHtml(t) : '<span class="glyph">★ ' + esc(t && t.star != null ? t.star : '') + '</span>'; }
  function kind(t) { return (window.KRAY && KRAY.kindChipHtml) ? KRAY.kindChipHtml(t) : ''; }
  function addrLine(lab, a, link) {
    if (!a) return '';
    var body = link
      ? '<a href="/address/' + esc(a) + '">' + esc(short(a)) + '</a>'
      : '<span>' + esc(short(a)) + '</span>';
    return '<span title="' + esc(a) + '"><em>' + esc(lab) + '</em>' + body + '</span>';
  }
  function pathOf(r, link) {
    var a = r && (r.from || r.seller), b = r && r.to;
    if (!a && !b) return '';
    return addrLine('from', a, link) + addrLine('to', b, link);
  }
  function paintStats() {
    var s = pulse.stats || {};
    var box = $('mkstats');
    if (!box) return;
    box.innerHTML =
      '<div class="mkstat"><div class="k">listed</div><div class="v">' + num(s.listed || listings.length || 0) + '</div></div>' +
      '<div class="mkstat"><div class="k">sales</div><div class="v">' + num(s.sales || 0) + '</div></div>' +
      '<div class="mkstat"><div class="k">volume</div><div class="v">' + num(s.volume || 0) + ' ₭</div></div>' +
      '<div class="mkstat"><div class="k">acts · 1 ₭ fee</div><div class="v">' + num(s.acts || 0) + '</div></div>';
  }
  function slide(title, tiles) {
    if (!tiles || !tiles.length) return '';
    return '<div class="slide"><h2>' + esc(title) + '</h2><div class="slide-rail">' + tiles.join('') + '</div></div>';
  }
  function sqStar(l, tag, kind) {
    var price = l.price != null ? l.price : l.amount;
    return '<a class="sq" href="/star/' + esc(l.star) + '">' +
      '<div class="art facefill">' + face(l) +
        (tag ? '<span class="tg" style="background:' + hue(kind) + '">' + esc(tag) + '</span>' : '') +
      '</div>' +
      '<span class="nm">' + esc(l.name || ('★ ' + l.star)) + '</span>' +
      '<span class="px">' + (price != null ? num(price) + ' ₭' : '') + '</span></a>';
  }
  function sqCol(c) {
    return '<a class="sq" href="/collection/' + esc(c.name) + '">' +
      '<div class="art facefill">' + face(c) + '</div>' +
      '<span class="nm">' + esc(c.name) + '</span>' +
      '<span class="px">' + (c.floor ? 'floor ' + num(c.floor) + ' ₭' : (esc(String(c.childCount || 0)) + ' items')) + '</span></a>';
  }
  function featuredStars() {
    var out = [], seen = {};
    function push(list, tag, kind) {
      (list || []).forEach(function (l) {
        if (!l || l.star == null || seen[String(l.star)]) return;
        seen[String(l.star)] = true;
        out.push(sqStar(l, tag, kind));
      });
    }
    push(pulse.sold, 'sold', 'star-buy');
    push(pulse.expensive, 'ask', 'star-list');
    push(pulse.bids, 'offer', 'star-offer');
    push(pulse.listed, 'listed', 'star-list');
    return out.slice(0, 12);
  }
  function paintPulse() {
    var box = $('pulse');
    if (!box) return;
    if (tab === 'listed') { box.innerHTML = slide('Featured', featuredStars()); return; }
    if (tab === 'collections') {
      var hot = (pulse.hotCollections && pulse.hotCollections.length) ? pulse.hotCollections : collections.slice(0, 8);
      box.innerHTML = slide('Featured', hot.slice(0, 8).map(sqCol));
      return;
    }
    box.innerHTML = '';
  }
  async function load() {
    try {
      var r = await fetch('/api/kraynet/market').then(function (x) { return x.json(); });
      listings = (r && r.listings) || [];
      pulse = r || {};
      $('live').classList.add('on');
    } catch (_) { listings = []; pulse = {}; }
    draw();
  }
  async function loadCols() {
    try {
      var pair = await Promise.all([
        fetch('/api/kraynet/collections').then(function (x) { return x.json(); }),
        fetch('/api/kraynet/market').then(function (x) { return x.json(); }).catch(function () { return pulse; }),
      ]);
      collections = (pair[0] && pair[0].collections) || [];
      if (pair[1] && !pair[1].error) pulse = pair[1];
      $('live').classList.add('on');
    } catch (_) { collections = []; }
    draw();
  }

  function card(l) {
    var mine = me && l.seller === me;
    var acts;
    if (mine) {
      acts = '<button type="button" class="btn" data-relist="' + esc(l.star) + '" data-price="' + esc(l.price) + '">Relist</button>' +
             '<button type="button" class="btn" data-cancel="' + esc(l.star) + '">Cancel</button>';
    } else {
      acts = '<button type="button" class="btn primary" data-buy="' + esc(l.star) + '" data-price="' + esc(l.price) + '" data-seller="' + esc(l.seller) + '">Buy now · ' + num(l.price) + ' ₭</button>';
    }
    return '<article class="cardm">' +
      '<a class="art facefill" href="/star/' + esc(l.star) + '">' + face(l) + '</a>' +
      '<div class="body">' +
        (mine ? '<span class="mine-tag">your listing</span>' : '<span class="mine-tag">listed</span>') +
        '<a class="nm" href="/star/' + esc(l.star) + '">' + esc((window.KRAY && KRAY.starTitle) ? KRAY.starTitle(l) : ('★ ' + l.star + (l.name ? ' · ' + l.name : ''))) + '</a>' +
        kind(l) +
        '<span class="no">★ ' + esc(l.star) + (l.rarity ? ' · ' + esc(l.rarity) : '') + (l.collection ? ' · ' + esc(l.collection) : '') + '</span>' +
        '<span class="who">' + pathOf(l, true) + '</span>' +
        '<span class="px">' + num(l.price) + ' ₭</span>' +
        '<div class="acts">' + acts + '</div>' +
      '</div></article>';
  }
  function soldCard(r) {
    return '<article class="cardm">' +
      '<a class="art facefill" href="/star/' + esc(r.star) + '">' + face(r) + '</a>' +
      '<div class="body">' +
        '<span class="mine-tag">sold</span>' +
        '<a class="nm" href="/star/' + esc(r.star) + '">' + esc((window.KRAY && KRAY.starTitle) ? KRAY.starTitle(r) : ('★ ' + r.star + (r.name ? ' · ' + r.name : ''))) + '</a>' +
        kind(r) +
        '<span class="no">★ ' + esc(r.star) + (r.collection ? ' · ' + esc(r.collection) : '') + '</span>' +
        '<span class="who">' + pathOf(r, true) + '</span>' +
        '<span class="px">' + (r.amount != null ? num(r.amount) + ' ₭' : '—') + '</span>' +
        '<div class="acts"><a class="btn" href="/star/' + esc(r.star) + '">Open</a></div>' +
      '</div></article>';
  }

  function colRankRow(c, i) {
    return '<a class="rkrow" href="/collection/' + esc(c.name) + '">' +
      '<span class="n">' + (i + 1) + '</span>' +
      '<span class="face facefill fixed">' + face(c) + '</span>' +
      '<span class="nm">' + esc(c.name) + '<small>' + esc(String(c.childCount)) + ' items · ' + esc(String(c.listed)) + ' listed</small></span>' +
      '<span class="cell hide-sm">' + esc(String(c.childCount)) + '</span>' +
      '<span class="cell hide-sm">' + esc(String(c.listed)) + '</span>' +
      '<span class="px">' + (c.floor ? num(c.floor) + ' ₭' : '—') + '</span>' +
      '<span class="cell hide-sm">' + (c.volume && c.volume !== '0' ? num(c.volume) + ' ₭' : '—') + '</span>' +
      '<span class="cell hide-sm">' + num(c.sales || 0) + '</span></a>';
  }

  function draw() {
    me = window.__krayAddr || me;
    paintAcct();
    paintStats();
    document.querySelectorAll('#tabs .tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    var g = $('grid'), e = $('empty');
    paintPulse();
    if (tab === 'activity') {
      g.className = '';
      var tape = pulse.tape || [];
      if (!tape.length) {
        g.innerHTML = '';
        e.hidden = false;
        e.textContent = 'No market acts yet. The first list, sale or cancel will open this tape.';
        return;
      }
      e.hidden = true;
      g.innerHTML = '<div class="hleg">' +
        '<span><i style="background:' + hue('star-list') + '"></i>listed / relisted</span>' +
        '<span><i style="background:' + hue('star-buy') + '"></i>sold</span>' +
        '<span><i style="background:' + hue('star-offer') + '"></i>offer</span>' +
        '<span><i style="background:' + hue('star-offer-accept') + '"></i>accepted</span>' +
        '<span><i style="background:' + hue('star-delist') + '"></i>cancelled</span>' +
        '</div><div class="hist">' + tape.map(function (r) {
          var kind = r.kind || 'star-list';
          var clock = (r.at && window.KRAY && KRAY.clock) ? KRAY.clock(r.at) : '';
          var ago = (r.at && window.KRAY && KRAY.ago) ? KRAY.ago(r.at) : '';
          var local = '';
          try { if (r.at) local = new Date(Number(r.at)).toLocaleString(); } catch (_) {}
          var who = pathOf(r, false);
          return '<a class="hrow" href="/star/' + esc(r.star) + '">' +
            '<span class="hsq facefill fixed">' + face(r) + '</span>' +
            '<span class="htag" style="background:' + hue(kind) + '">' + esc(r.tag || r.kind) + '</span>' +
            '<span class="hnm"><b>' + esc(r.name || ('★ ' + r.star)) + '</b><span class="meta">★ ' + esc(r.star) + (r.collection ? ' · ' + esc(r.collection) : '') + '</span></span>' +
            '<span class="hwho">' + (who || '—') + '</span>' +
            '<span class="hb" title="' + esc(local || 'validated on the journal') + '">' +
              (r.amount != null ? '<span class="ht">' + num(r.amount) + ' ₭</span>' : '<span class="ht">—</span>') +
              (clock ? '<span class="hr">' + esc(clock) + (ago ? ' · ' + esc(ago) : '') + '</span>' : '') +
            '</span></a>';
        }).join('') + '</div>';
      return;
    }
    if (tab === 'collections') {
      g.className = '';
      if (!collections.length) {
        g.innerHTML = '';
        e.hidden = false;
        e.textContent = 'No named parent stars have children yet. Baptize a parent and inscribe its children — that lineage is the collection.';
        return;
      }
      e.hidden = true;
      var ranked = collections.slice().sort(function (a, b) {
        try { var d = BigInt(b.volume || '0') - BigInt(a.volume || '0'); if (d !== 0n) return d > 0n ? 1 : -1; } catch (_) {}
        return (b.sales || 0) - (a.sales || 0) || (b.listed - a.listed);
      });
      g.innerHTML = '<div class="rkboard">' +
        '<div class="rkhead"><span class="n">#</span><span></span><span>Collection</span><span class="hide-sm">Items</span><span class="hide-sm">Listed</span><span>Floor</span><span class="hide-sm">Volume</span><span class="hide-sm">Sales</span></div>' +
        ranked.map(colRankRow).join('') +
        '</div>';
      return;
    }
    g.className = '';
    e.hidden = true;
    var rows = tab === 'yours' ? listings.filter(function (l) { return me && l.seller === me; }) : listings;
    var title = tab === 'yours' ? 'Your listings' : 'Listed';
    var html = '<div class="mk-block"><h2>' + title + '</h2>';
    if (!rows.length) {
      html += '<div class="mk-empty">' + (tab === 'yours'
        ? (me ? 'You have no live listings. Open a star in KrayWallet to list it.' : 'Connect KrayWallet to see your listings.')
        : 'No live asks on the book. List a star from KrayWallet — the card, the price and the buy button appear here.') + '</div></div>';
    } else {
      html += '<div class="mk-grid">' + rows.map(card).join('') + '</div></div>';
    }
    if (tab === 'listed' && pulse.sold && pulse.sold.length) {
      html += '<div class="mk-block"><h2>Recent sales</h2><div class="mk-grid">' + pulse.sold.slice(0, 8).map(soldCard).join('') + '</div></div>';
    }
    g.innerHTML = html;
  }

  async function doBuy(star, price, seller, btn) {
    if (!window.__krayAddr) { toast('Connect your KrayWallet in the header first.'); return; }
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Signing…';
    try {
      await window.KRAY.act('star-buy', { star: String(star), price: String(price), seller: seller });
      toast('Bought ★ ' + star + ' — the star is yours, proven on-chain.');
      await load();
    } catch (e) { toast((e && e.message) || 'refused'); btn.disabled = false; btn.textContent = old; }
  }
  async function doCancel(star, btn) {
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Signing…';
    try {
      await window.KRAY.act('star-delist', { star: String(star) });
      toast('Listing for ★ ' + star + ' cancelled.');
      await load();
    } catch (e) { toast((e && e.message) || 'refused'); btn.disabled = false; btn.textContent = old; }
  }
  async function doRelist(star, current) {
    var v = prompt('New price in ₭ for star #' + star + ' (current ' + num(current) + '):', String(current).replace(/[^0-9]/g, ''));
    if (v == null) return;
    var price = String(v).replace(/[^0-9]/g, '');
    if (!price || Number(price) <= 0) { toast('Enter a positive whole number of ₭.'); return; }
    try {
      await window.KRAY.act('star-list', { star: String(star), price: price });
      toast('★ ' + star + ' re-listed at ' + num(price) + ' ₭.');
      await load();
    } catch (e) { toast((e && e.message) || 'refused'); }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-buy],[data-cancel],[data-relist],[data-tab]');
    if (!t) return;
    if (t.dataset.tab) {
      tab = t.dataset.tab;
      if (tab === 'collections') { try { history.replaceState(null, '', path === '/collections' ? '/collections' : '/market#collections'); } catch (_) {} loadCols(); return; }
      if (tab === 'activity') { try { history.replaceState(null, '', '/market#activity'); } catch (_) {} if (!pulse.tape) load(); else draw(); return; }
      try { history.replaceState(null, '', path === '/collections' ? '/market' : (location.pathname + (location.search || ''))); } catch (_) {}
      draw();
      if (!listings.length) load();
      return;
    }
    if (t.dataset.buy != null) return doBuy(t.dataset.buy, t.dataset.price, t.dataset.seller, t);
    if (t.dataset.cancel != null) return doCancel(t.dataset.cancel, t);
    if (t.dataset.relist != null) return doRelist(t.dataset.relist, t.dataset.price);
  });

  window.addEventListener('kray-connected', function (e) { me = e.detail && e.detail.address; draw(); });
  window.addEventListener('kray-disconnected', function () { me = null; draw(); });
  window.addEventListener('DOMContentLoaded', function () {
    me = window.__krayAddr || null; paintAcct();
    document.querySelectorAll('#tabs .tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    if (tab === 'collections') loadCols(); else load();
    setInterval(function () { if (tab === 'collections') loadCols(); else load(); }, 15000);
  });
})();
</script>
</body>
</html>
